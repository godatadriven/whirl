[project]
name = "whirl"
version = "0.1.0"
description = "Docker-based local development and testing tool for Apache Airflow workflows"
readme = "README.md"
# Pinned to the 3.13 series: it matches the Docker image / CI matrix and is the
# newest Python that Apache Airflow 3.2.1 supports. Widening this (e.g. to 3.14)
# breaks resolution of the `test` group, which installs apache-airflow.
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.15.11",
]
# Test toolchain (managed with uv). Installs Airflow + the curated provider set
# required to parse the "core subset" of example DAGs. See tests/ and CONTRIBUTING.md.
test = [
    "pytest>=8",
    "apache-airflow==3.2.1",
    "apache-airflow-providers-standard",
    "apache-airflow-providers-amazon",
    "apache-airflow-providers-http",
    "apache-airflow-providers-apache-spark",
    "apache-airflow-providers-common-sql",
    "apache-airflow-providers-ssh",
    "apache-airflow-providers-sftp",
    "apache-airflow-providers-mysql",
    "pendulum",
    "pandas",
    "ephem",
]

[tool.ruff]
# Matches requires-python above and the Docker image / CI matrix.
target-version = "py313"
line-length = 100
# So `from conftest import ...` sorts as first-party.
src = ["tests"]

[tool.ruff.lint]
# Ruff's default rule set (E4/E7/E9 + F) plus import sorting, pyupgrade and
# bugbear. E501 (line-too-long) stays off: the example DAGs carry long Spark
# config literals that read worse when wrapped.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Example DAGs are teaching material: they intentionally target the oldest
# Airflow/Python the matrix supports and are written for readability over
# idiom. Keep E/F (real errors) on them, but not the style/modernisation
# rules -- their correctness is covered end-to-end by the `whirl ci` jobs.
"examples/**" = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "dag_validation: validates that example DAGs parse without import errors",
    "setup_scripts: structural/convention checks for whirl setup scripts",
]